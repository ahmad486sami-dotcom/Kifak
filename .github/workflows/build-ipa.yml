name: Build IPA for ESign (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      # Test builds skip the paywall (store purchases don't work in sideloaded apps)
      EXPO_PUBLIC_TEST_UNLOCK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install packages
        run: |
          npm install
          npx expo install --fix || true

      - name: Generate iOS project
        run: npx expo prebuild -p ios --clean --no-install

      - name: Install pods
        run: cd ios && pod install

      - name: Build (no signing — ESign signs it)
        run: |
          set -o pipefail
          xcodebuild -workspace ios/Kifak.xcworkspace -scheme Kifak -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/Kifak.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -n 80

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Kifak.xcarchive/Products/Applications/Kifak.app Payload/
          zip -qry Kifak-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Kifak-unsigned-ipa
          path: Kifak-unsigned.ipa
          retention-days: 14
