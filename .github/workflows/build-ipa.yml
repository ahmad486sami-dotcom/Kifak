name: Build IPA for ESign (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    # no app rebuild for notes, backend or TestFlight-setup changes
    paths-ignore: ["**.md", "supabase/**", "eas.json", ".github/workflows/testflight.yml"]

concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  # Fast check (~3 min, Linux): installs packages and bundles the app code.
  # Catches code/package problems before the 25-minute Mac build.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install packages
        run: npm install
      - name: Show key package versions
        run: npm ls expo expo-asset expo-modules-core expo-constants expo-router babel-preset-expo @expo/metro-config @expo/prebuild-config --all 2>&1 | grep -E "expo|babel-preset|metro-config|prebuild-config" | head -60 || true
      - name: Bundle the app code for iPhone
        env:
          EXPO_PUBLIC_TEST_UNLOCK: "1"
        run: npx expo export --platform ios --output-dir /tmp/dist

  build:
    needs: check
    # Apple-chip (arm64) Macs were overloaded on 19 Nov 2026 — Intel runners queue faster. Switch back to macos-15 if this label is retired.
    runs-on: macos-15-intel
    timeout-minutes: 60
    env:
      # Test builds skip the paywall (store purchases don't work in sideloaded apps)
      EXPO_PUBLIC_TEST_UNLOCK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install packages
        run: npm install

      - name: Test-build settings
        # Expo reads .env when bundling the app code — makes sure the paywall skip is baked in
        run: echo "EXPO_PUBLIC_TEST_UNLOCK=1" > .env

      - name: Generate iOS project
        run: npx expo prebuild -p ios --clean --no-install

      - name: Install pods
        run: cd ios && pod install

      - name: Build (no signing — ESign signs it)
        run: |
          xcodebuild -workspace ios/Kifak.xcworkspace -scheme Kifak -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/Kifak.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > build.log 2>&1 || {
              echo "::group::Errors"; grep -nE "(^|[^_])error: |^Error: |❌|BUNDLE FAILED|Cannot find module|Unable to resolve" build.log | grep -v "export " | head -60; echo "::endgroup::"
              echo "::group::Last 200 lines"; tail -n 200 build.log; echo "::endgroup::"
              exit 1; }
          tail -n 20 build.log

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Kifak.xcarchive/Products/Applications/Kifak.app Payload/
          zip -qry Kifak-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Kifak-unsigned-ipa
          path: Kifak-unsigned.ipa
          retention-days: 14
