name: Send to TestFlight

# Run it from the Actions tab → "Send to TestFlight" → Run workflow.
# Builds a signed iPhone build on the Expo build servers and uploads it to TestFlight.
#
# Repo secrets needed (Settings → Secrets and variables → Actions):
#   EXPO_TOKEN       expo.dev → Account settings → Access tokens
#   EAS_PROJECT_ID   expo.dev → the kifak project → Project ID
#   ASC_KEY_ID       App Store Connect → Users and Access → Integrations → App Store Connect API (Key ID)
#   ASC_ISSUER_ID    same page (Issuer ID)
#   ASC_KEY_P8       the whole text of the downloaded .p8 key file
#   APPLE_TEAM_ID    developer.apple.com → Membership details → Team ID
#   ASC_APP_ID       App Store Connect → Kifak → App Information → Apple ID (number). Add after the first build.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "testflight = paywall skipped for testers · production = real paywall"
        type: choice
        options: [testflight, production]
        default: testflight
      submit_only:
        description: "Only upload the latest finished build (skip building)"
        type: boolean
        default: false

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
      EXPO_ASC_API_KEY_PATH: ${{ github.workspace }}/asc-key.p8
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
      ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          missing=""
          for s in EXPO_TOKEN EAS_PROJECT_ID EXPO_ASC_KEY_ID EXPO_ASC_ISSUER_ID EXPO_APPLE_TEAM_ID ASC_KEY_P8; do
            [ -z "${!s}" ] && missing="$missing $s"
          done
          if [ -n "$missing" ]; then echo "::error::Missing repo secrets:$missing"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install packages
        run: npm install

      - name: Write App Store Connect key
        run: printf '%s\n' "$ASC_KEY_P8" > asc-key.p8

      - name: Build signed iPhone app (Expo build servers)
        if: ${{ !inputs.submit_only }}
        run: npx --yes eas-cli@latest build --platform ios --profile ${{ inputs.profile }} --non-interactive --wait

      - name: Upload to TestFlight
        run: |
          if [ -z "$ASC_APP_ID" ]; then
            echo "::warning::Build is done, but ASC_APP_ID isn't set yet. Create the Kifak app in App Store Connect (bundle ID com.kifak.app), add its Apple ID number as the ASC_APP_ID secret, then run this again with 'submit_only' ticked."
            exit 0
          fi
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync("eas.json", "utf8"));
            const p = process.argv[1];
            c.submit[p] = { ios: {
              ascAppId: process.env.ASC_APP_ID,
              ascApiKeyPath: process.env.EXPO_ASC_API_KEY_PATH,
              ascApiKeyId: process.env.EXPO_ASC_KEY_ID,
              ascApiKeyIssuerId: process.env.EXPO_ASC_ISSUER_ID,
              appleTeamId: process.env.EXPO_APPLE_TEAM_ID
            } };
            fs.writeFileSync("eas.json", JSON.stringify(c, null, 2));
          ' "${{ inputs.profile }}"
          npx --yes eas-cli@latest submit --platform ios --profile ${{ inputs.profile }} --latest --non-interactive --wait

      - name: Remove key file
        if: always()
        run: rm -f asc-key.p8
